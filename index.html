<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickVideo - Video Downloader</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f4f6f8;
color:#222;
min-height:100vh;
}

header{
background:#111827;
color:white;
text-align:center;
padding:25px 15px;
}

header h1{
font-size:28px;
margin-bottom:8px;
}

header p{
font-size:14px;
color:#d1d5db;
}

.container{
width:92%;
max-width:600px;
margin:40px auto;
}

.card{
background:white;
padding:28px 20px;
border-radius:18px;
box-shadow:0 5px 25px rgba(0,0,0,.08);
text-align:center;
}

.card h2{
font-size:24px;
margin-bottom:10px;
}

.card p{
font-size:14px;
color:#666;
margin-bottom:20px;
}

input{
width:100%;
padding:15px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
margin-bottom:12px;
}

button{
width:100%;
padding:15px;
border:0;
border-radius:10px;
background:#111827;
color:white;
font-size:16px;
font-weight:bold;
}

#message{
display:none;
margin-top:15px;
padding:12px;
background:#f1f5f9;
border-radius:8px;
font-size:14px;
}

.info{
margin-top:25px;
text-align:left;
}

.info h3{
margin-bottom:10px;
}

.info li{
margin:8px 0;
font-size:14px;
color:#555;
}

footer{
text-align:center;
margin-top:30px;
font-size:13px;
color:#777;
}
</style>
</head>

<body>

<header>
<h1>QuickVideo</h1>
<p>Simple Video Downloader</p>
</header>

<div class="container">

<div class="card">

<h2>Download Video</h2>

<p>Paste a public video link below</p>

<input id="videoUrl" type="url" placeholder="Paste video link here">

<button onclick="downloadVideo()">Download Video</button>

<div id="message"></div>

<div class="info">
<h3>How to use</h3>
<ul>
<li>Copy a public video link.</li>
<li>Paste it in the box.</li>
<li>Tap Download Video.</li>
</ul>
</div>

</div>

<footer>
© 2026 QuickVideo
</footer>

</div>

<script>
function downloadVideo(){

let url=document.getElementById("videoUrl").value.trim();
let message=document.getElementById("message");

message.style.display="block";

if(url===""){
message.innerText="Please paste a video link first.";
return;
}

if(!url.startsWith("http")){
message.innerText="Please enter a valid URL.";
return;
}

message.innerText="Link received. Downloader system will be connected next.";
}
</script>

</body>
</html>
