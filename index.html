<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>QuickVideo - Video Downloader</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 25px 15px;
    }

    header h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    header p {
      color: #d1d5db;
      font-size: 14px;
    }

    .container {
      width: 92%;
      max-width: 600px;
      margin: 45px auto;
    }

    .card {
      background: white;
      padding: 28px 20px;
      border-radius: 18px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    .card h2 {
      font-size: 24px;
      margin-bottom: 10px;
    }

    .card p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 22px;
      line-height: 1.5;
    }

    .url-input {
      width: 100%;
      padding: 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      margin-bottom: 12px;
    }

    .url-input:focus {
      border-color: #111827;
    }

    .download-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .download-btn:active {
      transform: scale(0.98);
    }
